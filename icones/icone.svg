<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="moldura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ea"/>
      <stop offset="1" stop-color="#1f7fd0"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#9fb4c9" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9fb4c9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dentro"><rect x="44" y="44" width="400" height="400" rx="76"/></clipPath>
  </defs>

  <!-- moldura azul e fundo escuro -->
  <rect x="20" y="20" width="448" height="448" rx="100" fill="url(#moldura)"/>
  <rect x="44" y="44" width="400" height="400" rx="76" fill="#0b1118"/>

  <g clip-path="url(#dentro)">
    <!-- cone de luz -->
    <polygon points="318,150 412,142 470,470 196,470" fill="url(#luz)"/>
    <!-- poste e braço -->
    <path d="M132 430 V 226 Q 132 150 214 128 L 318 112" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- luminária -->
  <path d="M300 104 Q 362 86 416 98 Q 428 102 424 114 Q 420 126 404 128 Q 352 136 306 132 Q 292 130 292 118 Q 292 108 300 104 Z" fill="#fff"/>
  <ellipse cx="362" cy="134" rx="46" ry="9" fill="url(#brilho)"/>

  <!-- prancheta -->
  <rect x="284" y="292" width="200" height="200" rx="34" fill="#0b1118"/>
  <rect x="300" y="312" width="168" height="168" rx="24" fill="#0b1118" stroke="#fff" stroke-width="15"/>
  <rect x="352" y="290" width="64" height="34" rx="11" fill="#0b1118" stroke="#fff" stroke-width="12"/>
  <path d="M327 372 l16 16 l28 -32" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M327 428 l16 16 l28 -32" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="390" y1="374" x2="442" y2="374" stroke="#3a9be0" stroke-width="13" stroke-linecap="round"/>
  <line x1="390" y1="430" x2="442" y2="430" stroke="#3a9be0" stroke-width="13" stroke-linecap="round"/>
</svg>
